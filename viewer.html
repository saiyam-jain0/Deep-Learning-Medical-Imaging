<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>
  <style> #viewer { width: 90vw; height: 80vh; border: 1px solid #ddd; }</style>
</head>
<body>
  <div id="viewer"></div>
  <script>
    var viewer = OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
      tileSources: {
        type: 'image',
        url: "{{ url_for('static_file', filename=slide_img.split('static/')[1]) }}"
      }
    });
    var img = document.createElement('img');
    img.src = "{{ url_for('static_file', filename=heatmap.split('static/')[1]) }}";
    img.style.opacity = 0.6;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.position = 'absolute';
    viewer.canvas.appendChild(img);
  </script>
</body>
</html>
